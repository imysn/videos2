name: rave-private
x-runtime: &runtime
  image: rave-private:${RAVE_IMAGE_TAG:-v1}
  build:
    context: .
    dockerfile: infra/Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp:size=268435456, mode=1777]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 40s
  environment: &environment
    APP_ENV: production
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Configure un origen HTTPS autorizado}
    COOKIE_SECURE: "true"
    PORT: "3000"
    DATA_ROOT: /data
    DATABASE_URL_FILE: /run/secrets/database_url
    MASTER_KEY_FILE: /run/secrets/master_key
    BOOTSTRAP_CREDENTIALS_FILE: /private/bootstrap-credentials.json
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-21474836480}
    MEDIA_JOB_CONCURRENCY: "1"
    FFMPEG_THREADS: "2"
    BACKUP_TARGET: /backups
    BACKUP_RECIPIENT: ${BACKUP_RECIPIENT:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE:-}
    GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
    GOOGLE_CLOUD_PROJECT_NUMBER: ${GOOGLE_CLOUD_PROJECT_NUMBER:-}
    GOOGLE_REDIRECT_URI: ${PUBLIC_ORIGIN}/api/v1/admin/drive/callback
  secrets: [database_url, master_key]
  volumes: [media:/data, backups:/backups, private:/private]
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: rave
      POSTGRES_DB: rave
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rave -d rave"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    <<: *runtime
    command: [api]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *runtime
    command: [worker]
    depends_on:
      app: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    environment:
      RAVE_HOST: ${RAVE_HOST:?Configure el nombre del destino autorizado}
    ports: ["80:80", "443:443"]
    volumes:
      [
        "./infra/Caddyfile:/etc/caddy/Caddyfile:ro",
        caddy_data:/data,
        caddy_config:/config,
      ]
volumes:
  database:
  media:
  backups:
  private:
  caddy_data:
  caddy_config:
secrets:
  postgres_password:
    { file: "${RAVE_SECRET_DIR:-./.local/production}/postgres_password" }
  database_url: { file: "${RAVE_SECRET_DIR:-./.local/production}/database_url" }
  master_key: { file: "${RAVE_SECRET_DIR:-./.local/production}/master_key" }
