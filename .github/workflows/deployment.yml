name: Docker deployment
on:
  push:
    branches: [feat/rave-private-v1, main]
    paths:
      [
        "infra/**",
        "compose*.yaml",
        "scripts/**",
        "apps/**",
        "packages/**",
        "tests/**",
        "package.json",
        "pnpm-lock.yaml",
        "tsconfig*.json",
        ".github/workflows/deployment.yml",
      ]
  pull_request:
    paths:
      [
        "infra/**",
        "compose*.yaml",
        "scripts/**",
        "apps/**",
        "packages/**",
        "tests/**",
        "package.json",
        "pnpm-lock.yaml",
        "tsconfig*.json",
        ".github/workflows/deployment.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:deployment ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ strategy.job-index }}
          path: artifacts/verification/deployment-*.json
          if-no-files-found: error
